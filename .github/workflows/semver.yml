# Gate changes against the latest stable crates.io release of every workspace
# crate. Intentional breaking changes pass once their version bump covers them.
name: Semver policy

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - .github/scripts/workspace_packages.py
      - .github/workflows/semver.yml
  push:
    branches:
      - main
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - .github/scripts/workspace_packages.py
      - .github/workflows/semver.yml
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semver-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  select-packages:
    name: select semver packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select publishable workspace packages
        id: packages
        shell: bash
        run: |
          workspace_packages=$(python3 .github/scripts/workspace_packages.py)
          packages=$(jq -c \
            '[.[] | select(.publish == null or .publish == true or (.publish | type == "array" and length > 0)) | .name]' \
            <<< "$workspace_packages")
          if [[ "$packages" == '[]' ]]; then
            echo "The workspace has no publishable packages" >&2
            exit 1
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  semver:
    name: semver (${{ matrix.package }})
    needs: select-packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select-packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          # Match Zakura's deliberate exception to tool-version pinning:
          # cargo-semver-checks must track stable rustdoc format changes.
          tool: cargo-semver-checks

      - name: Check public API compatibility
        env:
          PACKAGE: ${{ matrix.package }}
        run: >-
          cargo semver-checks
          --package "$PACKAGE"
          --default-features
