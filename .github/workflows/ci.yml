name: CI

# The test and cross-target suites below are adapted from each upstream
# repository's primary CI workflow, as inspected on 2026-08-11. Book and API
# documentation jobs are omitted. Shared lint, formatting, and MSRV checks use
# the same policy as zakura-core/zakura.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changed upstreams
    runs-on: ubuntu-latest
    outputs:
      halo2: ${{ steps.filter.outputs.halo2 }}
      halo2_legacy_pdqsort: ${{ steps.filter.outputs.halo2_legacy_pdqsort }}
      orchard: ${{ steps.filter.outputs.orchard }}
      pasta_curves: ${{ steps.filter.outputs.pasta_curves }}
      reddsa: ${{ steps.filter.outputs.reddsa }}
      redjubjub: ${{ steps.filter.outputs.redjubjub }}
      sapling_crypto: ${{ steps.filter.outputs.sapling_crypto }}
      sinsemilla: ${{ steps.filter.outputs.sinsemilla }}
      librustzcash: ${{ steps.filter.outputs.librustzcash }}
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match changed paths to upstream repositories
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              base_sha=$PR_BASE_SHA
              head_sha=$PR_HEAD_SHA
              ;;
            push)
              base_sha=$PUSH_BASE_SHA
              head_sha=$PUSH_HEAD_SHA
              ;;
            merge_group)
              base_sha=$MERGE_BASE_SHA
              head_sha=$MERGE_HEAD_SHA
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ "$base_sha" == "0000000000000000000000000000000000000000" ]] ||
            ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            # Diff a new ref, or an unreachable pre-force-push base, from the
            # empty tree. The root manifest then conservatively selects all suites.
            base_sha=$(git hash-object -t tree /dev/null)
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            base_sha=$(git merge-base "$base_sha" "$head_sha")
          fi
          changed=$(git diff --name-only --no-renames "$base_sha" "$head_sha")

          halo2=false
          halo2_legacy_pdqsort=false
          orchard=false
          pasta_curves=false
          reddsa=false
          redjubjub=false
          sapling_crypto=false
          sinsemilla=false
          librustzcash=false
          shared=false

          # Every workspace member must map to a test group below. Fail closed
          # when the workspace grows so a new crate cannot inherit a green
          # aggregate status without ever being compiled.
          handled_members=(
            halo2_gadgets
            halo2_legacy_pdqsort
            halo2_poseidon
            halo2_proofs
            orchard
            pasta_curves
            reddsa
            redjubjub
            sapling-crypto
            sinsemilla
            zcash_keys
            zcash_primitives
            zcash_proofs
          )
          workspace_packages=$(python3 .github/scripts/workspace_packages.py)
          workspace_members=()
          while IFS= read -r member; do
            workspace_members+=("$member")
          done < <(jq -r '.[].directory' <<< "$workspace_packages")
          if ! diff -u \
            <(printf '%s\n' "${handled_members[@]}" | sort) \
            <(printf '%s\n' "${workspace_members[@]}" | sort); then
            echo "Every workspace member must be assigned to a CI test group" >&2
            exit 1
          fi

          while IFS= read -r path; do
            case "$path" in
              halo2_gadgets/*|halo2_poseidon/*|halo2_proofs/*)
                halo2=true
                ;;
              halo2_legacy_pdqsort/*)
                halo2_legacy_pdqsort=true
                ;;
              orchard/*)
                orchard=true
                ;;
              pasta_curves/*)
                pasta_curves=true
                ;;
              reddsa/*)
                reddsa=true
                ;;
              redjubjub/*)
                redjubjub=true
                ;;
              sapling-crypto/*)
                sapling_crypto=true
                ;;
              sinsemilla/*)
                sinsemilla=true
                ;;
              zcash_keys/*|zcash_primitives/*|zcash_proofs/*)
                librustzcash=true
                ;;
              Cargo.toml|Cargo.lock|rust-toolchain.toml|.cargo/*|.github/workflows/ci.yml|.github/workflows/maintenance.yml)
                shared=true
                ;;
            esac
          done <<< "$changed"

          if [[ "$shared" == true ]]; then
            halo2=true
            halo2_legacy_pdqsort=true
            orchard=true
            pasta_curves=true
            reddsa=true
            redjubjub=true
            sapling_crypto=true
            sinsemilla=true
            librustzcash=true
          fi

          matrix='[]'
          add_group() {
            matrix=$(jq -c \
              --arg upstream "$1" \
              --arg packages "$2" \
              --argjson has_upstream_ci "$3" \
              --argjson deny_warnings "$4" \
              '. + [{upstream: $upstream, packages: $packages, has_upstream_ci: $has_upstream_ci, deny_warnings: $deny_warnings}]' \
              <<< "$matrix")
          }

          [[ "$halo2" == true ]] && \
            add_group halo2 "halo2_gadgets halo2_poseidon halo2_proofs" true false
          [[ "$halo2_legacy_pdqsort" == true ]] && \
            add_group halo2_legacy_pdqsort halo2_legacy_pdqsort false false
          [[ "$orchard" == true ]] && add_group orchard orchard true true
          [[ "$pasta_curves" == true ]] && \
            add_group pasta_curves pasta_curves true false
          [[ "$reddsa" == true ]] && add_group reddsa reddsa true false
          [[ "$redjubjub" == true ]] && add_group redjubjub redjubjub true false
          [[ "$sapling_crypto" == true ]] && \
            add_group sapling-crypto sapling-crypto true true
          [[ "$sinsemilla" == true ]] && add_group sinsemilla sinsemilla false false
          [[ "$librustzcash" == true ]] && \
            add_group librustzcash "zcash_keys zcash_primitives zcash_proofs" true true

          {
            echo "halo2=$halo2"
            echo "halo2_legacy_pdqsort=$halo2_legacy_pdqsort"
            echo "orchard=$orchard"
            echo "pasta_curves=$pasta_curves"
            echo "reddsa=$reddsa"
            echo "redjubjub=$redjubjub"
            echo "sapling_crypto=$sapling_crypto"
            echo "sinsemilla=$sinsemilla"
            echo "librustzcash=$librustzcash"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

  rust-checks:
    name: ${{ matrix.upstream }} / Stable Rust checks
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Check locked all-feature build
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          package_args=()
          for package in $PACKAGES; do
            package_args+=(--package "$package")
          done
          cargo +stable check --locked --all-features --all-targets "${package_args[@]}"
      - name: Run Clippy
        shell: bash
        env:
          DENY_WARNINGS: ${{ matrix.deny_warnings }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          package_args=()
          lint_args=()
          for package in $PACKAGES; do
            package_args+=(--package "$package")
          done
          if [[ "$DENY_WARNINGS" == true ]]; then
            lint_args+=(-- -D warnings)
          fi
          cargo +stable clippy --locked --all-features --all-targets \
            --no-deps "${package_args[@]}" "${lint_args[@]}"
      - name: Test crates without upstream CI
        if: ${{ !matrix.has_upstream_ci }}
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          package_args=()
          for package in $PACKAGES; do
            package_args+=(--package "$package")
          done
          cargo +stable test --locked "${package_args[@]}"

  msrv:
    name: ${{ matrix.upstream }} / MSRV
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check on Rust 1.88
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          package_args=()
          for package in $PACKAGES; do
            package_args+=(--package "$package")
          done
          cargo +1.88.0 check --locked "${package_args[@]}"

  formatting:
    name: ${{ matrix.upstream }} / Formatting
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          package_args=()
          for package in $PACKAGES; do
            package_args+=(--package "$package")
          done
          cargo +nightly fmt "${package_args[@]}" -- --check

  # zcash/halo2 .github/workflows/ci.yml @
  # 723a90bc598d986bdf59941a8011c60a0819d6b9
  halo2-test:
    name: halo2 / Test on ${{ matrix.os }}${{ matrix.name_suffix }}
    needs: changes
    if: needs.changes.outputs.halo2 == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        stage: [stable, beta, nightly]
        os: [ubuntu-latest, windows-latest, macOS-latest]
        include:
          - stage: stable
            features: ""
            name_suffix: ""
          - stage: beta
            features: beta
            name_suffix: " with beta features"
          - stage: nightly
            features: nightly
            name_suffix: " with nightly features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        shell: bash
        env:
          STAGE_FEATURE: ${{ matrix.features }}
        run: |
          features=batch,dev-graph,gadget-traces,test-dependencies
          if [[ -n "$STAGE_FEATURE" ]]; then
            features="$features,$STAGE_FEATURE"
          fi
          cargo +stable test --verbose --release \
            -p halo2_gadgets \
            -p halo2_poseidon \
            -p halo2_proofs \
            --no-default-features \
            --features "$features"
      - name: Verify working directory is clean
        run: git diff --exit-code

  halo2-test-32-bit:
    name: halo2 / Test i686${{ matrix.name_suffix }}
    needs: changes
    if: needs.changes.outputs.halo2 == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [stable, beta, nightly]
        include:
          - stage: stable
            name_suffix: ""
          - stage: beta
            name_suffix: " with beta features"
          - stage: nightly
            name_suffix: " with nightly features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: i686-unknown-linux-gnu
      - name: Install cross-platform support dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Run tests
        shell: bash
        env:
          STAGE: ${{ matrix.stage }}
        run: |
          features=batch,dev-graph,gadget-traces,test-dependencies
          if [[ "$STAGE" != stable ]]; then
            features="$features,$STAGE"
          fi
          cargo +1.88.0 test --verbose --release \
            -p halo2_gadgets \
            -p halo2_poseidon \
            -p halo2_proofs \
            --target i686-unknown-linux-gnu \
            --no-default-features \
            --features "$features"

  halo2-build:
    name: halo2 / Build ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.halo2 == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - wasm32-wasip1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - name: Build target
        run: >-
          cargo +1.88.0 build
          -p halo2_gadgets
          -p halo2_poseidon
          -p halo2_proofs
          --target ${{ matrix.target }}
          --no-default-features
          --features batch,dev-graph,gadget-traces,nightly

  # zcash/orchard .github/workflows/ci.yml @
  # 3f7ebf716a04bb76f35afe9fa5296064fcd451ca
  orchard-test:
    name: orchard / Test on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.orchard == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo +stable test -p orchard --verbose
      - name: Compile-check verifier-fingerprint capture
        run: >-
          cargo +stable test -p orchard
          --features verifier-fingerprint
          --no-run
          --verbose
      - name: Verify working directory is clean
        run: git diff --exit-code

  orchard-no-std:
    name: orchard / Build no_std for ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.orchard == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - wasm32-wasip1
          - thumbv7em-none-eabihf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - name: Build no_std target
        run: >-
          cargo +1.88.0 build -p orchard
          --no-default-features
          --target ${{ matrix.target }}
          --verbose

  # zcash/pasta_curves .github/workflows/ci.yml @
  # bd896a571d34bceb3451a048a08cf21f78ef1942
  pasta-test:
    name: pasta_curves / Test on ${{ matrix.os }} (${{ matrix.features }})
    needs: changes
    if: needs.changes.outputs.pasta_curves == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        features: [--all-features, --no-default-features]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: >-
          cargo +stable test -p pasta_curves
          --verbose
          --release
          ${{ matrix.features }}
      - name: Verify working directory is clean
        run: git diff --exit-code

  pasta-test-32-bit:
    name: pasta_curves / Test i686 (${{ matrix.features }})
    needs: changes
    if: needs.changes.outputs.pasta_curves == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [--all-features, --no-default-features]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: i686-unknown-linux-gnu
      - name: Install cross-platform support dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Run tests
        run: >-
          cargo +1.88.0 test -p pasta_curves
          --verbose
          --target i686-unknown-linux-gnu
          ${{ matrix.features }}
      - name: Verify working directory is clean
        run: git diff --exit-code

  pasta-no-std:
    name: pasta_curves / Build no_std for ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.pasta_curves == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv6m-none-eabi
          - wasm32-unknown-unknown
          - wasm32-wasip1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - name: Build target
        run: >-
          cargo +1.88.0 build -p pasta_curves
          --verbose
          --target ${{ matrix.target }}
          --no-default-features

  # ZcashFoundation/reddsa .github/workflows/main.yml @
  # ad34fbe2eb3c3471f43823407b89f313745d51da
  reddsa-build:
    name: reddsa / Build
    needs: changes
    if: needs.changes.outputs.reddsa == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo +stable build -p reddsa

  reddsa-no-std:
    name: reddsa / Build no_std
    needs: changes
    if: needs.changes.outputs.reddsa == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: thumbv6m-none-eabi
      - run: >-
          cargo +1.88.0 build -p reddsa
          --no-default-features
          --target thumbv6m-none-eabi

  # ZcashFoundation/redjubjub .github/workflows/main.yml @
  # 5a299f0f2e7e3e7a478f3466f85d77ecbf4db6c6
  redjubjub-test:
    name: redjubjub / Test
    needs: changes
    if: needs.changes.outputs.redjubjub == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo +stable test -p redjubjub --all-features

  redjubjub-no-std:
    name: redjubjub / Build no_std for ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.redjubjub == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - wasm32-wasip1
          - thumbv7em-none-eabihf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - run: >-
          cargo +1.88.0 build -p redjubjub
          --no-default-features
          --target ${{ matrix.target }}
          --verbose

  # zcash/sapling-crypto .github/workflows/ci.yml @
  # 1b24fd9fd20284fdac1c99e0069dbda24e608e57
  sapling-test:
    name: sapling-crypto / Test on ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.sapling_crypto == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: >-
          cargo +stable test -p sapling-crypto
          --all-features
          --verbose
          --release
      - name: Verify working directory is clean
        run: git diff --exit-code

  sapling-no-std:
    name: sapling-crypto / Build no_std for ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.sapling_crypto == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - wasm32-wasip1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - name: Build target
        run: >-
          cargo +1.88.0 build -p sapling-crypto
          --no-default-features
          --target ${{ matrix.target }}
          --verbose

  # zcash/librustzcash .github/workflows/ci.yml @
  # 82fa052a06e3af0058a73f320538f9b93193439c
  librustzcash-test:
    name: librustzcash subset / Test all features
    needs: changes
    if: needs.changes.outputs.librustzcash == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: 1
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Run tests
        run: >-
          cargo +1.88.0 test
          -p zcash_keys
          -p zcash_primitives
          -p zcash_proofs
          --all-features
          -- --test-threads=2
      - name: Verify working directory is clean
        run: git diff --exit-code

  librustzcash-feature-check:
    name: librustzcash subset / Check ${{ matrix.state }}
    needs: changes
    if: needs.changes.outputs.librustzcash == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - state: no-default-features
            flags: --no-default-features
          - state: transparent-inputs-only
            flags: >-
              --no-default-features
              --features zcash_keys/transparent-inputs,zcash_primitives/transparent-inputs
          - state: transparent-key-encoding-only
            flags: >-
              --no-default-features
              --features zcash_keys/transparent-key-encoding
          - state: Sapling-only
            flags: >-
              --no-default-features
              --features zcash_keys/sapling,zcash_primitives/circuits
          - state: Orchard
            flags: >-
              --no-default-features
              --features zcash_keys/orchard,zcash_primitives/circuits
          - state: all-features
            flags: --all-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check all test targets
        run: >-
          cargo +1.88.0 check
          -p zcash_keys
          -p zcash_primitives
          -p zcash_proofs
          --all-targets
          ${{ matrix.flags }}

  librustzcash-no-std:
    name: librustzcash subset / Build ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.librustzcash == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-wasip1
            packages: -p zcash_proofs
            build-deps: gcc-multilib
          - target: thumbv7em-none-eabihf
            packages: -p zcash_keys -p zcash_primitives
            build-deps: gcc-arm-none-eabi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-platform support dependencies
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.build-deps }}
      - name: Build target
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          TARGET: ${{ matrix.target }}
        run: cargo +1.88.0 build $PACKAGES --no-default-features --target "$TARGET" --verbose

  librustzcash-clippy-beta:
    name: librustzcash subset / Clippy on beta
    needs: changes
    if: needs.changes.outputs.librustzcash == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@beta
        with:
          components: clippy
      - run: >-
          cargo +beta clippy
          -p zcash_keys
          -p zcash_primitives
          -p zcash_proofs
          --no-deps
          --all-features
          --all-targets
          -- -W clippy::all

  librustzcash-clippy-features:
    name: librustzcash subset / Clippy each feature
    needs: changes
    if: needs.changes.outputs.librustzcash == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - name: Clippy each feature of each imported crate
        shell: bash
        run: |
          for package in zcash_keys zcash_primitives zcash_proofs; do
            cargo +1.88.0 metadata --no-deps --format-version 1 |
              jq -r --arg package "$package" \
                '.packages[] | select(.name == $package) | .features | keys[]' |
              while IFS= read -r feature; do
                cargo +1.88.0 clippy -p "$package" \
                  --no-deps \
                  --no-default-features \
                  --features "$feature"
              done
          done

  test-success:
    name: test success
    if: always()
    needs:
      - changes
      - rust-checks
      - msrv
      - formatting
      - halo2-test
      - halo2-test-32-bit
      - halo2-build
      - orchard-test
      - orchard-no-std
      - pasta-test
      - pasta-test-32-bit
      - pasta-no-std
      - reddsa-build
      - reddsa-no-std
      - redjubjub-test
      - redjubjub-no-std
      - sapling-test
      - sapling-no-std
      - librustzcash-test
      - librustzcash-feature-check
      - librustzcash-no-std
      - librustzcash-clippy-beta
      - librustzcash-clippy-features
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          # Every job except the detector is path-gated. A skipped job is valid,
          # but a failed or cancelled job must still fail this aggregate status.
          allowed-skips: >-
            rust-checks,
            msrv,
            formatting,
            halo2-test,
            halo2-test-32-bit,
            halo2-build,
            orchard-test,
            orchard-no-std,
            pasta-test,
            pasta-test-32-bit,
            pasta-no-std,
            reddsa-build,
            reddsa-no-std,
            redjubjub-test,
            redjubjub-no-std,
            sapling-test,
            sapling-no-std,
            librustzcash-test,
            librustzcash-feature-check,
            librustzcash-no-std,
            librustzcash-clippy-beta,
            librustzcash-clippy-features
